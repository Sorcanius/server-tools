# server-tools central job definitions
# Format:
# id|group|cron(5 fields)|random_delay_seconds|timeout_seconds|user|script
#
# Local devices can override selected fields in:
#   /etc/server-tools/scheduler/jobs.local.conf
# Device group opt-in is controlled by:
#   /etc/server-tools/scheduler/scheduler-groups.conf

debian-update|base|0 4 * * *|7200|0|root|/opt/server-tools/jobs/debian-update/run.sh
mount-check|base|0 * * * *|300|600|root|/opt/server-tools/jobs/mount-check/run.sh
project-zomboid-update|project-zomboid|55 0-16 * * *|0|1800|root|/opt/server-tools/projects/project-zomboid/update/check-update.sh
